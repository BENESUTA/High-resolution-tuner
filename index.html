<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高精度Webチューナー</title>
<style>
:root{--bg:#e9ecea;--fg:#16201c;--pn:#f7f8f6;--mut:#5f6d66;--ln:#c4ccc7;--ok:#0b7a52;--ng:#b4410f;--mk:#16201c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101513;--fg:#e4ebe7;--pn:#19201d;--mut:#8b9a92;--ln:#303b36;--ok:#4fd6a0;--ng:#f0894f;--mk:#e4ebe7}}
:root[data-theme="dark"]{--bg:#101513;--fg:#e4ebe7;--pn:#19201d;--mut:#8b9a92;--ln:#303b36;--ok:#4fd6a0;--ng:#f0894f;--mk:#e4ebe7}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.6 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px;font-weight:700}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:6px 8px;min-width:0}
input[type=number]{width:96px}select{width:72px}
button{cursor:pointer;font-weight:700}button.go{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.big{font:700 clamp(44px,13vw,76px)/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-align:center;letter-spacing:-1px;margin:6px 0 0;transition:color .15s}
.big small{font-size:.32em;letter-spacing:0;margin-left:6px}
.sub{text-align:center;color:var(--mut);min-height:24px}
.g{position:relative;height:46px;margin:10px 4px 4px;border-bottom:1px solid var(--ln)}
.g i{position:absolute;bottom:0;width:1px;height:12px;background:var(--ln)}
.g i.c{height:34px;background:var(--fg);width:2px;margin-left:-1px}
.g b{position:absolute;bottom:0;width:6px;height:40px;margin-left:-3px;background:var(--ng);border-radius:2px;transition:left .12s,background .15s}
.g b.ok{background:var(--ok)}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0;font-variant-numeric:tabular-nums}
dt{color:var(--mut)}dd{margin:0;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
canvas{display:block;width:100%;height:130px;margin-top:8px}
</style></head><body><main>
<h1>高精度Webチューナー</h1>
<section class="pn">
<div class="row">
<label>音名<select id="nn"></select></label>
<label>オクターブ<select id="oc"></select></label>
<label>基準 A4 (Hz)<input id="a4" type="number" value="440" step="0.1" min="400" max="480"></label>
<label>目標周波数 (Hz)<input id="hz" type="number" value="440" step="0.001" min="20" max="4000"></label>
</div>
<div class="row" style="margin-top:12px">
<label>測定方式<select id="md" style="width:auto"><option value="beat">うなり（高精度）</option><option value="ac">自己相関（高速）</option></select></label>
<button id="st" class="go">マイク開始</button>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="rf" type="checkbox">基準音を鳴らす</label>
</div>
<p class="note" id="msg">マイクを許可すると測定を始めます。基準音を鳴らす場合はイヤホンを推奨します。</p>
</section>
<section class="pn">
<div class="big" id="d">--<small>Hz</small></div>
<div class="sub" id="s">目標との差（＋は高い、－は低い）</div>
<div class="g" id="g"></div>
<canvas id="cv" role="img" aria-label="うなり波形"></canvas>
</section>
<section class="pn"><dl>
<dt>目標</dt><dd id="t">-</dd><dt>検出周波数</dt><dd id="f">-</dd><dt>ずれ（セント）</dt><dd id="c">-</dd><dt>詳細</dt><dd id="x">-</dd>
</dl></section>
</main>
<script>
const $=id=>document.getElementById(id),NM=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let ctx,stream,bp1,bp2,node,osc,f0=440,last='note',D={mode:'beat',n:0,gate:false},AB=new Float32Array(8192),AR={f:null,cl:0};
NM.forEach((n,i)=>$('nn').add(new Option(n,i)));for(let o=0;o<=8;o++)$('oc').add(new Option(o,o));
$('nn').value=9;$('oc').value=4;
// ---- target setting
function fromNote(){f0=+$('a4').value*Math.pow(2,((+$('oc').value+1)*12+ +$('nn').value-69)/12);$('hz').value=f0.toFixed(3);last='note';apply()}
function fromHz(){f0=Math.min(4000,Math.max(20,+$('hz').value||440));last='hz';near();apply()}
function near(){const m=Math.round(69+12*Math.log2(f0/+$('a4').value));if(m>=12&&m<120){$('nn').value=((m%12)+12)%12;$('oc').value=Math.floor(m/12)-1}}
$('nn').onchange=$('oc').onchange=fromNote;$('hz').onchange=fromHz;
$('a4').onchange=()=>last==='note'?fromNote():fromHz();
$('md').onchange=()=>{D.mode=$('md').value;resetDSP()};
function apply(){resetDSP();tone();$('t').textContent=f0.toFixed(3)+' Hz'}
// ---- DSP helpers
function lp(fc,fs){const w=2*Math.PI*fc/fs,c=Math.cos(w),a=Math.sin(w)/1.4142,a0=1+a;return{b0:(1-c)/2/a0,b1:(1-c)/a0,b2:(1-c)/2/a0,a1:-2*c/a0,a2:(1-a)/a0}}
class BQ{constructor(c){this.c=c;this.x1=this.x2=this.y1=this.y2=0}
p(x){const c=this.c,y=c.b0*x+c.b1*this.x1+c.b2*this.x2-c.a1*this.y1-c.a2*this.y2;this.x2=this.x1;this.x1=x;this.y2=this.y1;this.y1=y;return y}}
function resetDSP(){if(!ctx)return;const fs=ctx.sampleRate,fc=Math.min(f0*0.45,60),mk=()=>[new BQ(lp(fc,fs)),new BQ(lp(fc,fs))];
Object.assign(D,{fs,w0:2*Math.PI*f0/fs,ph:0,rms2:0,Ls:mk(),Li:mk(),Lq:mk(),mean:1,amp:0,pd:0,st:0,rz:0,fz:0,R:[],F:[],sg:0,pI:0,pQ:0,n:0,lastPush:0,est:null,cnt:0,gate:false,dec:Math.max(1,Math.round(fs/200)),dc:0,hv:new Float32Array(1200),hh:0,hn:0,ps:new Float64Array(400),pn:0,pu:0,pa:0,pf:null});
bp1.frequency.value=bp2.frequency.value=f0;AR.f=null}
// ---- beat mode: (mic + reference sine)^2 -> low-pass -> envelope zero-crossings
function push(a,t){if(!t)return;if(a.length>=2){const p=(a[a.length-1]-a[0])/(a.length-1),q=(t-a[a.length-1])/p;if(q<0.7||q>1.43)a.length=0}
a.push(t);if(a.length>7)a.shift();D.lastPush=D.n;let num=0,den=0;for(const b of [D.R,D.F])if(b.length>1){num+=b.length-1;den+=b[b.length-1]-b[0]}
D.est=den>0?num/den*D.fs:null;D.cnt=D.R.length+D.F.length}
function beat(inp){const d=D,fs=d.fs,ka=1/(0.3*fs),km=1/(6*fs),ks=1/(0.2*fs),kd=1-1/(6*fs);
for(let i=0;i<inp.length;i++){const x=inp[i];d.n++;d.rms2+=(x*x-d.rms2)*ka;d.gate=d.rms2>4e-6;
const y=d.gate?x*0.7071/Math.sqrt(d.rms2):0;d.ph+=d.w0;if(d.ph>6.283185307179586)d.ph-=6.283185307179586;
const sn=Math.sin(d.ph),cs=Math.cos(d.ph),s=y+sn;
const v=d.Ls[1].p(d.Ls[0].p(s*s)),I=d.Li[1].p(d.Li[0].p(2*y*cs)),Q=d.Lq[1].p(d.Lq[0].p(-2*y*sn));
d.sg+=((d.pI*Q-d.pQ*I)-d.sg)*ks;d.pI=I;d.pQ=Q;   // rotation direction of (I,Q) gives the sign only
if(++d.dc>=d.dec){d.dc=0;d.hv[d.hh]=v;d.hh=(d.hh+1)%1200;d.hn++;   // 200Hz history for the graph + beat-phase track
if(d.gate&&I*I+Q*Q>0.04){const a=Math.atan2(Q,I);let df=a-d.pa;df-=6.283185307179586*Math.round(df/6.283185307179586);d.pa=a;d.pu=d.pn?d.pu+df:a;d.ps[d.pn%400]=d.pu;d.pn++}else d.pn=0}
if(!d.gate){d.R.length=d.F.length=0;d.est=null;d.st=0;d.pd=0;continue}
const m=d.mean;d.mean+=(v-m)*km;const dv=v-m;d.amp=Math.max(Math.abs(dv),d.amp*kd);
if(d.pd<=0&&dv>0)d.rz=d.n-1-d.pd/(dv-d.pd);else if(d.pd>=0&&dv<0)d.fz=d.n-1-d.pd/(dv-d.pd);
const h=0.25*d.amp;
if(d.st<=0&&dv>h){d.st=1;push(d.R,d.rz);d.rz=0}else if(d.st>=0&&dv<-h){d.st=-1;push(d.F,d.fz);d.fz=0}
d.pd=dv}phase()}
// long-period beats: slope of the beat phase (least squares over up to 2 s) gives the offset without waiting for full cycles
function phase(){const d=D,M=Math.min(d.pn,400);if(M<160){d.pf=null;return}
let sx=0,sy=0,sxx=0,sxy=0;for(let k=0;k<M;k++){const y=d.ps[(d.pn-M+k)%400];sx+=k;sy+=y;sxx+=k*k;sxy+=k*y}
d.pf=(M*sxy-sx*sy)/(M*sxx-sx*sx)*(d.fs/d.dec)/6.283185307179586}
// ---- autocorrelation mode (NSDF + parabolic interpolation)
function ac(inp){AB.copyWithin(0,inp.length);AB.set(inp,AB.length-inp.length);
const fs=ctx.sampleRate,W=4096,t0=Math.max(2,Math.floor(fs/(f0*1.6))-1),t1=Math.min(4000,Math.ceil(fs/(f0/1.6))+1),b=AB.length-W-t1,N=new Float32Array(t1+2);
let e=0;for(let j=0;j<W;j++)e+=AB[b+j]*AB[b+j];if(e/W<4e-6){AR.f=null;return}
let mx=0;for(let t=t0;t<=t1;t++){let a=0,m=0;for(let j=0;j<W;j++){const p=AB[b+j],q=AB[b+j+t];a+=p*q;m+=p*p+q*q}N[t]=m>0?2*a/m:0;if(N[t]>mx)mx=N[t]}
if(mx<0.6){AR.f=null;return}
for(let t=t0+1;t<t1;t++)if(N[t]>N[t-1]&&N[t]>=N[t+1]&&N[t]>=0.9*mx){const A=N[t-1],B=N[t],C=N[t+1],dn=A-2*B+C,sh=dn?0.5*(A-C)/dn:0,f=fs/(t+sh);
AR.f=(AR.f&&Math.abs(f-AR.f)/AR.f<0.02)?AR.f+0.5*(f-AR.f):f;AR.cl=B;return}AR.f=null}
// ---- audio setup
function tone(){if(!ctx)return;if(osc){try{osc.stop()}catch(e){}osc.disconnect();osc=null}
if($('rf').checked){osc=ctx.createOscillator();osc.frequency.value=f0;const g=ctx.createGain();g.gain.value=0.15;osc.connect(g).connect(ctx.destination);osc.start()}}
$('rf').onchange=tone;
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await ctx.resume();
const src=ctx.createMediaStreamSource(stream);bp1=ctx.createBiquadFilter();bp2=ctx.createBiquadFilter();bp1.type=bp2.type='bandpass';bp1.Q.value=bp2.Q.value=3;
node=ctx.createScriptProcessor(2048,1,1);const mu=ctx.createGain();mu.gain.value=0;
src.connect(bp1);bp1.connect(bp2);bp2.connect(node);node.connect(mu);mu.connect(ctx.destination);
node.onaudioprocess=e=>{const inp=e.inputBuffer.getChannelData(0);D.mode==='beat'?beat(inp):ac(inp)};
D.mode=$('md').value;resetDSP();tone();$('st').textContent='停止';$('msg').textContent='測定中（サンプルレート '+ctx.sampleRate+' Hz）';
}catch(err){$('msg').textContent='マイクを使えませんでした：'+err.message+'。ブラウザのマイク許可と、ページがマイク利用可能な環境で開かれているか確認してください。'}}
function stop(){stream&&stream.getTracks().forEach(t=>t.stop());node&&(node.onaudioprocess=null);ctx&&ctx.close();ctx=null;osc=null;$('st').textContent='マイク開始';$('msg').textContent='停止しました。'}
$('st').onclick=()=>ctx?stop():start();
// ---- display
const G=$('g');let h='';for(let c=-50;c<=50;c+=10)h+=`<i class="${c?'':'c'}" style="left:${50+c}%"></i>`;G.innerHTML=h+'<b id="mk" style="left:50%"></b>';
function show(df,note){const el=$('d'),mk=$('mk');
if(df==null){el.innerHTML='--<small>Hz</small>';$('s').textContent=note;mk.style.left='50%';mk.className='';$('f').textContent=$('c').textContent='-';return}
const f=f0+df,ct=1200*Math.log2(f/f0),ok=Math.abs(df)<0.1;
el.innerHTML=(df>=0?'+':'−')+Math.abs(df).toFixed(Math.abs(df)<10?3:2)+'<small>Hz</small>';el.style.color=ok?'var(--ok)':'var(--fg)';
$('s').textContent=note;mk.style.left=(50+Math.max(-50,Math.min(50,ct)))+'%';mk.className=ok?'ok':'';
$('f').textContent=f.toFixed(3)+' Hz';$('c').textContent=(ct>=0?'+':'')+ct.toFixed(2)+' ct'}
const cv=$('cv');
function draw(){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*r)||cv.height!==Math.round(h*r)){cv.width=Math.round(w*r);cv.height=Math.round(h*r)}
const c=cv.getContext('2d'),rs=getComputedStyle(document.documentElement),g=k=>rs.getPropertyValue(k).trim();
c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,w,h);c.strokeStyle=g('--ln');c.lineWidth=1;c.beginPath();
for(const y of[0.25,0.5,0.75]){c.moveTo(0,h*y);c.lineTo(w,h*y)}c.stroke();c.fillStyle=g('--mut');c.font='11px sans-serif';
if(!ctx||D.mode!=='beat'||!D.hv){c.fillText(!ctx?'マイク開始後、うなり波形（直近約6秒）を表示します':'自己相関モードではうなり波形は表示されません',8,15);return}
c.fillText('うなり波形（直近約6秒・中央線が平均）',8,15);
const n=Math.min(D.hn,1200),s=D.hn>=1200?D.hh:0;if(n<2)return;
c.strokeStyle=g('--fg');c.lineWidth=1.6;c.beginPath();
for(let k=0;k<n;k++){const x=w-(n-k)*w/1200,y=h*(1-D.hv[(s+k)%1200]/2);k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
function loop(){requestAnimationFrame(loop);draw();if(!ctx){return}
if(D.mode==='ac'){$('x').textContent=AR.f?'自己相関 明瞭度 '+AR.cl.toFixed(2):'-';AR.f?show(AR.f-f0,'自己相関（リアルタイム）'):show(null,'信号を待っています');return}
if(!D.gate){$('x').textContent='-';show(null,'信号を待っています');return}
const fs=D.fs,age=(D.n-D.lastPush)/fs;
if(D.est&&age<Math.max(0.6,0.8/D.est)&&(D.pf==null||Math.abs(D.est-Math.abs(D.pf))<Math.max(0.05,0.3*D.est))){const df=((D.pf!=null?D.pf:D.sg)>=0?1:-1)*D.est;$('x').textContent='うなり周期 '+(1/D.est).toFixed(3)+' s / 交差 '+D.cnt;show(df,'うなり方式（周期から算出）')}
else if(D.pf!=null){const a=Math.abs(D.pf);$('x').textContent=a>0.005?'うなり周期 '+(1/a).toFixed(1)+' s（位相追従）':'うなり周期 ∞（位相追従）';show(D.pf,'1周期を測定中：位相の傾きで暫定表示')}
else{$('x').textContent='うなり待ち';show(null,'測定中…')}}
fromNote();loop();
</script></body></html>
