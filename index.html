<style>

:root[data-theme="dark"]{--bg:#101513;--fg:#e4ebe7;--pn:#19201d;--mut:#8b9a92;--ln:#303b36;--ok:#4fd6a0;--ng:#f0894f;--mk:#e4ebe7}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}

input[type=number]{width:96px}select{width:72px}
button{cursor:pointer;font-weight:700}
input:disabled,select:disabled{opacity:.45;cursor:not-allowed}button.go{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.big{font:700 clamp(44px,13vw,76px)/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-align:center;letter-spacing:-1px;margin:6px 0 0;transition:color .15s}
.big small{font-size:.32em;letter-spacing:0;margin-left:6px}
.sub{text-align:center;color:var(--mut);min-height:24px}

.g i.c{height:34px;background:var(--fg);width:2px;margin-left:-1px}
.g b{position:absolute;bottom:0;width:6px;height:40px;margin-left:-3px;background:var(--ng);border-radius:2px;transition:left .12s,background .15s}

.note{font-size:12px;color:var(--mut);margin:6px 0 0}

</style></head><body><main>
<div class="row" style="justify-content:space-between;align-items:center"><h1 data-i="title" style="margin:4px 0"></h1><select id="lg" aria-label="Language" style="width:auto"><option value="ja">日本語</option><option value="en">English</option></select></div>

</div>

</dl></section>
</main>

running:(s,k)=>`測定中（${k}・サンプルレート ${s} Hz）`,stopped:'停止しました。',micerr:e=>`マイクを使えませんでした：${e}。ブラウザのマイク許可と、ページがマイク利用可能な環境で開かれているか確認してください。`,
cvnone:'マイク開始後、うなり波形（直近6秒）を表示します',cvac:'自己相関モードではうなり波形は表示されません',cvt:'うなり波形（直近6秒）',laneM:o=>`基準−${o}Hz`,lane0:'基準±0',laneP:o=>`基準+${o}Hz`,

en:{title:'High-Precision Web Tuner',note:'Note',oct:'Octave',a4:'Reference A4 (Hz)',hz:'Target frequency (Hz)',auto:'Auto (detect the note)',meth:'Method',beat:'Beat (high precision)',ac:'Autocorrelation (fast)',start:'Start mic',stop:'Stop',ref:'Play reference tone',

autop:n=>`Auto ${n}: `,acinfo:c=>`Autocorrelation clarity ${c}`,acrt:'Autocorrelation (real-time)',detecting:'Detecting the note…',wait:'Waiting for a signal',beatinfo:s=>`Beats ${s} Hz`,measuring:'Measuring… (about 1–2 s)',
how1:o=>`From the beat difference of the ±${o} Hz references`,how2:'From the beat period of the reference signals'}};
let LG=(()=>{try{const v=localStorage.getItem('lg');if(v&&I[v])return v}catch(e){}return /^ja/i.test(navigator.language||'')?'ja':'en'})(),MSG=()=>t('hint'),COL={};
const t=(k,...a)=>{const v=I[LG][k];return typeof v==='function'?v(...a):v},sv=(e,v)=>{if(e._v!==v){e._v=v;e.textContent=v}};
function setMsg(f){MSG=f;sv($('msg'),f())}
function applyLang(){document.documentElement.lang=LG;document.title=t('title');document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
$('st').textContent=t(ctx?'stop':'start');sv($('msg'),MSG());cv.setAttribute('aria-label',t('alt'));if(!ctx)sv($('s'),t('sub0'))}
$('lg').value=LG;$('lg').onchange=()=>{LG=$('lg').value;try{localStorage.setItem('lg',LG)}catch(e){}applyLang()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{COL={}});
NM.forEach((n,i)=>$('nn').add(new Option(n,i)));for(let o=0;o<=8;o++)$('oc').add(new Option(o,o));
$('nn').value=9;$('oc').value=4;
// ---- target setting
function fromNote(){f0=+$('a4').value*Math.pow(2,((+$('oc').value+1)*12+ +$('nn').value-69)/12);$('hz').value=f0.toFixed(3);last='note';apply()}
function fromHz(){f0=Math.min(4000,Math.max(20,+$('hz').value||440));last='hz';near();apply()}
function near(){const m=Math.round(69+12*Math.log2(f0/+$('a4').value));if(m>=12&&m<120){$('nn').value=((m%12)+12)%12;$('oc').value=Math.floor(m/12)-1}}
const man=()=>{$('au').checked=false};   // editing the target by hand turns auto off
const lock=()=>{for(const i of['nn','oc','hz'])$(i).disabled=$('au').checked};   // auto on: note/octave/Hz are display-only (greyed out)
$('au').onchange=()=>{cfg({auto:$('au').checked});lock()};lock();
$('nn').onchange=$('oc').onchange=()=>{man();fromNote()};$('hz').onchange=()=>{man();fromHz()};
$('a4').onchange=()=>{cfg({a4:+$('a4').value});last==='note'?fromNote():fromHz()};
$('md').onchange=()=>{M=$('md').value;cfg({mode:M,reset:true})};
function apply(){cfg({f0,reset:true});setBP();tone();$('t').textContent=f0.toFixed(3)+' Hz'}
// ---- DSP engine. Self-contained (no outer references) so that the very same source runs inside an AudioWorklet
// (built from EngineFactory.toString()) or, if worklets are unavailable, on the main thread via ScriptProcessorNode.
const OFS=4;   // keep equal to OFS inside EngineFactory (used here for labels only)
function EngineFactory(){
const OFS=4;   // offset (Hz) of the two outer reference sines from the target
function lp(fc,fs){const w=2*Math.PI*fc/fs,c=Math.cos(w),a=Math.sin(w)/1.4142,a0=1+a;return{b0:(1-c)/2/a0,b1:(1-c)/a0,b2:(1-c)/2/a0,a1:-2*c/a0,a2:(1-a)/a0}}
class BQ{constructor(c){this.c=c;this.x1=this.x2=this.y1=this.y2=0}
p(x){const c=this.c,y=c.b0*x+c.b1*this.x1+c.b2*this.x2-c.a1*this.y1-c.a2*this.y2;this.x2=this.x1;this.x1=x;this.y2=this.y1;this.y1=y;return y}}
// autocorrelation (NSDF + parabolic interpolation): {f,cl} of the first strong peak in [fmin,fmax], or null
function nsdf(buf,fs,fmin,fmax,sp=1,W=4096){const t0=Math.max(2,Math.floor(fs/fmax)-1),t1=Math.min(4000,Math.ceil(fs/fmin)+1),b=buf.length-W-t1,N=new Float32Array(t1+2);
let e=0;for(let j=0;j<W;j++)e+=buf[b+j]*buf[b+j];if(e/W<4e-6)return null;
let mx=0;for(let t=t0;t<=t1;t++){let a=0,m=0;for(let j=0;j<W;j+=sp){const p=buf[b+j],q=buf[b+j+t];a+=p*q;m+=p*p+q*q}N[t]=m>0?2*a/m:0;if(N[t]>mx)mx=N[t]}
if(mx<0.6)return null;
for(let t=t0+1;t<t1;t++)if(N[t]>N[t-1]&&N[t]>=N[t+1]&&N[t]>=0.9*mx){const A=N[t-1],B=N[t],C=N[t+1],dn=A-2*B+C,sh=dn?0.5*(A-C)/dn:0;return{f:fs/(t+sh),cl:B}}return null}
return class Engine{
constructor(fs,post){this.fs=fs;this.post=post;this.mode='beat';this.auto=true;this.a4=440;this.f0=440;this.AB=new Float32Array(8192);this.AB2=new Float32Array(4096);
this.AR={f:null,cl:0};this.AU={f:null,m:null,cnt:0,sk:false};this.aA=0;this.aC=0;this.aP=0;this.gen=0;this.tf=null;this.reset()}
cfg(o){const r=o.reset||(o.f0!==undefined&&o.f0!==this.f0);for(const k of['mode','auto','a4','f0'])if(o[k]!==undefined)this[k]=o[k];
if(o.auto!==undefined){this.AU.f=null;this.AU.cnt=0}if(r)this.reset()}
reset(){const fs=this.fs,f0=this.f0,fc=Math.min(f0*0.45,60),mk=()=>[new BQ(lp(fc,fs)),new BQ(lp(fc,fs))];
// three reference sines (f0-OFS, f0, f0+OFS), each summed with the mic signal and given its own beat detector

Object.assign(this,{gain:0,rms2:0,n:0,on:0,gate:false,dec:Math.max(1,Math.round(fs/200)),dc:0});this.AR.f=null;this.gen++}
// feed 'a' (band-passed mic) and 'b' (raw mic); any block length
process(a,b){const n=a.length;
if(this.mode==='ac'){this.AB.copyWithin(0,n);this.AB.set(a,this.AB.length-n);if((this.aC+=n)>=2048){this.aC=0;this.ac()}}else this.beat(a);
if(this.auto){const B=this.AB2,h=n>>1;B.copyWithin(0,h);for(let i=0;i<h;i++)B[B.length-h+i]=(b[2*i]+b[2*i+1])*0.5;   // 2:1 decimation

if((this.aP+=n)>=2048){this.aP=0;this.emit()}}
emit(){const c=this.ch;this.post({gen:this.gen,gate:this.gate,ests:c.map(x=>x.est),res:this.gate?this.result():null,AR:{f:this.AR.f,cl:this.AR.cl},AU:this.AU.f,tf:this.tf,hv:c.map(x=>x.out.splice(0))});this.tf=null}

push(c,a,t){if(!t)return;if(a.length>=2){const p=(a[a.length-1]-a[0])/(a.length-1),q=(t-a[a.length-1])/p;if(q<0.7||q>1.43)a.length=0}
a.push(t);while(a.length>7||(a.length>3&&t-a[0]>1.2*this.fs))a.shift();   // keep ~1.2 s of crossings so start-up transients age out
c.last=this.n;let num=0,den=0;for(const b of[c.R,c.F])if(b.length>1){num+=b.length-1;den+=b[b.length-1]-b[0]}
c.est=den>0?num/den*this.fs:null}
beat(inp){const fs=this.fs,ka=1/(0.3*fs),kw=1/(0.05*fs),km=1/(6*fs),kd=1-1/(6*fs),W=0.25*fs,ch=this.ch;let gain=this.gain,rec;
for(let i=0;i<inp.length;i++){const x=inp[i];this.n++;this.rms2+=(x*x-this.rms2)*(this.on<W?kw:ka);
if((i&15)===0){this.gate=this.rms2>4e-6;gain=this.gate?0.7071/Math.sqrt(this.rms2):0}   // AGC gain refreshed every 16 samples
this.on=this.gate?this.on+1:0;const y=Math.max(-2,Math.min(2,x*gain));rec=++this.dc>=this.dec;if(rec)this.dc=0;
for(let k=0;k<3;k++){const c=ch[k],sn=c.sn*c.cw+c.cs*c.sw;c.cs=c.cs*c.cw-c.sn*c.sw;c.sn=sn;   // rotating oscillator
const s=y+sn,v=c.L[1].p(c.L[0].p(s*s));if(rec)c.out.push(v);
if(this.on<W){c.mean=1;c.amp=0;c.R.length=c.F.length=0;c.est=null;c.st=0;c.pd=0;continue}   // warm-up: let AGC and filters settle
const m=c.mean;c.mean+=(v-m)*km;const dv=v-m;c.amp=Math.max(Math.abs(dv),c.amp*kd);
if(c.pd<=0&&dv>0)c.rz=this.n-1-c.pd/(dv-c.pd);else if(c.pd>=0&&dv<0)c.fz=this.n-1-c.pd/(dv-c.pd);

c.pd=dv}}

// Beat frequencies for the input offset d = f - f0:  ref(-OFS) -> |d+OFS|,  ref(0) -> |d|,  ref(+OFS) -> |d-OFS|.
// |d| < OFS : d = (b- - b+)/2 (both beats are about OFS Hz, so even d = 0 settles quickly; the sign comes for free).
// |d| >= OFS: |d| = b0 (or (b- + b+)/2), sign from b- > b+.
result(){const[m,z,p]=this.ch,ok=c=>c.est&&c.R.length+c.F.length>=4&&(this.n-c.last)/this.fs<Math.max(0.6,0.8/c.est);

if(Math.abs(T)<1.9*OFS)return{df:T/2,how:'how1'};return{df:(T>0?1:-1)*(ok(z)?z.est:S/2),how:'how2'}}

ac(){const r=nsdf(this.AB,this.fs,this.f0/1.6,this.f0*1.6),R=this.AR;if(!r){R.f=null;return}R.f=(R.f&&Math.abs(r.f-R.f)/R.f<0.02)?R.f+0.5*(r.f-R.f):r.f;R.cl=r.cl}
// ---- auto target: wide-band autocorrelation names the note, then the target moves to it
det(){const U=this.AU;if(U.f&&Math.abs(1200*Math.log2(U.f/this.f0))<30&&(U.sk=!U.sk))return;   // already on target: every other hop
const r=nsdf(this.AB2,this.fs/2,40,2000,2,2048);if(!r){U.f=null;U.cnt=0;return}
U.f=(U.f&&Math.abs(r.f-U.f)/U.f<0.02)?U.f+0.5*(r.f-U.f):r.f;
const m=Math.round(69+12*Math.log2(r.f/this.a4));U.cnt=m===U.m?U.cnt+1:1;U.m=m;

}}
// ---- main-thread glue
const MODSRC=()=>`const Engine=(${EngineFactory.toString()})();registerProcessor('tuner',class extends AudioWorkletProcessor{constructor(){super();this.e=new Engine(sampleRate,s=>this.port.postMessage(s));this.port.onmessage=m=>{if(m.data.cfg)this.e.cfg(m.data.cfg)}}process(i){const a=i[0][0];if(a)this.e.process(a,i[0][1]||a);return true}});`;
const cfg=o=>{W?W.port.postMessage({cfg:o}):ENG&&ENG.cfg(o)},setBP=()=>{if(bp1)bp1.frequency.value=bp2.frequency.value=f0};
function onState(s){S=s;if(s.gen!==gen){gen=s.gen;hh=hn=0}   // engine was reset: start a new waveform history
const n=s.hv[0].length;for(let i=0;i<n;i++){for(let j=0;j<3;j++)HV[j][hh]=s.hv[j][i];hh=(hh+1)%1200;hn++}
if(s.tf!=null)onTarget(s.tf)}
function onTarget(f){f0=f;$('hz').value=f0.toFixed(3);near();last='note';setBP();tone();sv($('t'),f0.toFixed(3)+' Hz')}   // target chosen by auto mode
// ---- audio setup
function tone(){if(!ctx)return;if(osc){try{osc.stop()}catch(e){}osc.disconnect();osc=null}
if($('rf').checked){osc=ctx.createOscillator();osc.frequency.value=f0;const g=ctx.createGain();g.gain.value=0.15;osc.connect(g).connect(ctx.destination);osc.start()}}
$('rf').onchange=tone;
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await ctx.resume();
const src=ctx.createMediaStreamSource(stream),mg=ctx.createChannelMerger(2),mu=ctx.createGain();mu.gain.value=0;mu.connect(ctx.destination);
bp1=ctx.createBiquadFilter();bp2=ctx.createBiquadFilter();bp1.type=bp2.type='bandpass';bp1.Q.value=bp2.Q.value=3;
src.connect(bp1);bp1.connect(bp2);bp2.connect(mg,0,0);src.connect(mg,0,1);setBP();   // ch0: band-passed mic, ch1: raw mic
let kind='AudioWorklet';
try{await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([MODSRC()],{type:'text/javascript'})));
W=new AudioWorkletNode(ctx,'tuner',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1],channelCount:2,channelCountMode:'explicit'});
W.port.onmessage=e=>onState(e.data);mg.connect(W);W.connect(mu)}
catch(e){kind='ScriptProcessor';W=null;ENG=new(EngineFactory())(ctx.sampleRate,onState);const sp=ctx.createScriptProcessor(1024,2,1);   // fallback
sp.onaudioprocess=ev=>ENG.process(ev.inputBuffer.getChannelData(0),ev.inputBuffer.getChannelData(1));mg.connect(sp);sp.connect(mu);ENG.sp=sp}
M=$('md').value;cfg({f0,mode:M,auto:$('au').checked,a4:+$('a4').value,reset:true});tone();

function stop(){stream&&stream.getTracks().forEach(k=>k.stop());ENG&&ENG.sp&&(ENG.sp.onaudioprocess=null);W&&(W.port.onmessage=null);ctx&&ctx.close();ctx=null;osc=null;W=null;ENG=null;S=null;
$('st').textContent=t('start');setMsg(()=>t('stopped'))}
$('st').onclick=()=>ctx?stop():start();
// ---- display
const G=$('g');let h='';for(let c=-50;c<=50;c+=10)h+=`<i class="${c?'':'c'}" style="left:${50+c}%"></i>`;G.innerHTML=h+'<b id="mk" style="left:50%"></b>';
function show(df,note){const el=$('d'),mk=$('mk');
if(df==null){sv($('dv'),'--');sv($('s'),note);mk.style.left='50%';mk.className='';sv($('f'),'-');sv($('c'),'-');return}
const f=f0+df,ct=1200*Math.log2(f/f0),ok=Math.abs(df)<0.1;
sv($('dv'),(df>=0?'+':'−')+Math.abs(df).toFixed(Math.abs(df)<10?3:2));el.style.color=ok?'var(--ok)':'var(--fg)';
sv($('s'),note);mk.style.left=(50+Math.max(-50,Math.min(50,ct)))+'%';mk.className=ok?'ok':'';
sv($('f'),f.toFixed(3)+' Hz');sv($('c'),(ct>=0?'+':'')+ct.toFixed(2)+' ct')}
const cv=$('cv');
function draw(){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*r)||cv.height!==Math.round(h*r)){cv.width=Math.round(w*r);cv.height=Math.round(h*r)}
const key=(ctx?1:0)+M+hn+LG+w;if(draw.k===key)return;draw.k=key;   // redraw only when there is new data
const c=cv.getContext('2d'),g=k=>COL[k]||(COL[k]=getComputedStyle(document.documentElement).getPropertyValue(k).trim()),T0=20,lh=(h-T0)/3;
c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,w,h);c.strokeStyle=g('--ln');c.lineWidth=1;c.beginPath();
for(let k=0;k<=3;k++){c.moveTo(0,T0+k*lh);c.lineTo(w,T0+k*lh)}c.stroke();c.fillStyle=g('--mut');c.font='11px sans-serif';
if(!ctx||M==='ac'||!S){c.fillText(t(!ctx?'cvnone':'cvac'),8,14);return}
c.fillText(t('cvt'),8,14);
const n=Math.min(hn,1200),s=hn>=1200?hh:0;
HV.forEach((hv,j)=>{const y0=T0+j*lh;c.fillStyle=g('--mut');c.fillText(t(['laneM','lane0','laneP'][j],OFS),8,y0+12);if(n<2)return;
c.strokeStyle=g('--fg');c.lineWidth=1.5;c.beginPath();
for(let k=0;k<n;k+=2){const x=w-(n-k)*w/1200,y=y0+lh*(1-Math.min(2,hv[(s+k)%1200])/2);k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()})}
function loop(){requestAnimationFrame(loop);draw();if(!ctx||!S)return;
const A=$('au').checked,pre=A?t('autop',NM[+$('nn').value]+$('oc').value):'';
if(M==='ac'){const a=S.AR;sv($('x'),a.f?t('acinfo',a.cl.toFixed(2)):'-');a.f?show(a.f-f0,pre+t('acrt')):show(null,A&&S.AU?t('detecting'):t('wait'));return}
const r=S.res;sv($('x'),S.gate?t('beatinfo',S.ests.map(e=>e?e.toFixed(3):'-').join(' / ')):'-');
if(r)show(r.df,pre+t(r.how,OFS));else show(null,S.gate?t('measuring'):A&&S.AU?t('detecting'):t('wait'))}
applyLang();fromNote();loop();
